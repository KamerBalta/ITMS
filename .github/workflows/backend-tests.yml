name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/Infera.sln

      - name: Build
        run: dotnet build backend/Infera.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Infera.sln --no-build --configuration Release --logger "console;verbosity=normal"